services:
  - type: web
    name: finimatic-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://finimatic-frontend.vercel.app/
      - key: FINIMATIC_ENVIRONMENT
        value: production
      - key: FINIMATIC_HOSTING_MODE
        value: render_free
      - key: FINIMATIC_AUTH_COOKIE_SECURE
        value: "1"
      - key: FINIMATIC_AUTH_CLIENT_ID
        sync: false
      - key: FINIMATIC_AUTH_CLIENT_SECRET
        sync: false
      - key: FINIMATIC_AUTH_AUTHORIZATION_URL
        sync: false
      - key: FINIMATIC_AUTH_TOKEN_URL
        sync: false
      - key: FINIMATIC_AUTH_REDIRECT_URI
        value: https://finimatic-frontend.vercel.app/api/auth/callback
      - key: SUPABASE_AUTH_ISSUER
        sync: false
      - key: SUPABASE_AUTH_AUDIENCE
        value: authenticated
      - key: SUPABASE_AUTH_JWKS_URL
        sync: false
      - key: FINIMATIC_AUTH_OPERATOR_SUBJECTS
        sync: false
      - key: FINIMATIC_AUTH_ADMIN_SUBJECTS
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        value: https://finimatic-frontend.vercel.app/api/settings/gmail-api/oauth/callback
      - key: FINIMATIC_DISABLE_SCHEDULER
        value: "1"
