services:
  - type: web
    name: finimatic-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: FERNET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        value: https://finimatic-frontend.vercel.app/
      - key: GMAIL_OAUTH_REDIRECT_URI
        value: https://finimatic-backend.onrender.com/api/settings/gmail-api/oauth/callback
      - key: FINIMATIC_DISABLE_SCHEDULER
        value: "0"
